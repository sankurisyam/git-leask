name: ShopKart Production Pipeline

'on':
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  docker:
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate image tag
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: build image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.image_tag }} .
      - name: PUSH IMAGE
        id: push
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.image_tag }}"
          docker push "$IMAGE"
          digest=$(docker inspect --format='{{index .RepoDigests 0 }}' "$IMAGE" | cut -d'@' -f2)
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image_digest=$digest"
  security_scan:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: scan for secrets
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.image_digest }}
          severity: CRITICAL
          exit-code: 1