name: ShopKart Production Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # 1. SECURITY
  # ==========================================

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security scan
        run: |
          echo "Running security scan..."
          sleep 5
          echo "Security scan passed"


  # ==========================================
  # 2. TEST
  # ==========================================

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Running unit tests..."
          sleep 4
          echo "Tests passed"


  # ==========================================
  # 3. LINT
  # ==========================================

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run lint
        run: |
          echo "Running ESLint..."
          sleep 2
          echo "Lint passed"


  # ==========================================
  # 4. BUILD
  # ==========================================

  build:
    name: Build Application

    needs:
      - security
      - test
      - lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          echo "Building application..."
          sleep 6
          echo "Build successful"


  # ==========================================
  # 5. DOCKER SECURITY SCAN
  # ==========================================

  docker_scan:
    name: Docker Image Scan

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Scan Docker image
        run: |
          echo "Scanning Docker image..."
          sleep 3
          echo "No critical vulnerabilities found"


  # ==========================================
  # 6. PUSH IMAGE
  # ==========================================

  push:
    name: Push Docker Image

    needs: docker_scan

    runs-on: ubuntu-latest

    steps:
      - name: Push image
        run: |
          echo "Pushing Docker image to registry..."
          sleep 1
          echo "Image pushed successfully"


  # ==========================================
  # 7. STAGING
  # ==========================================

  staging:
    name: Deploy Staging

    needs: push

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          sleep 4
          echo "Staging deployment successful"


  # ==========================================
  # 8. PRODUCTION
  # ==========================================

  production:
    name: Deploy Production

    needs: staging

    runs-on: ubuntu-latest

    steps:
      - name: Deploy production
        run: |
          echo "Deploying to production..."
          sleep 5
          echo "Production deployment successful"


  # ==========================================
  # 9. FAILURE NOTIFICATION
  # ==========================================

  notify:
    name: Failure Notification

    if: ${{ failure() }}

    needs:
      - security
      - test
      - lint
      - build
      - docker_scan
      - push
      - staging
      - production

    runs-on: ubuntu-latest

    steps:
      - name: Notify team
        run: |
          echo "🚨 ShopKart pipeline failed!"
          echo "Notify DevOps team"
