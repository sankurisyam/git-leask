name: ShopKart Production Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  
  security:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.security.outputs.result }}
    steps:
      - name: security check
        id: security
        run: |
          echo "result=pass" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: security
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: generate image tagp
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: build
        run: |
          echo "building docker: ${{ steps.meta.outputs.image_tag }}"
  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: scan image
        run: |
          echo "scanning docker image: ${{ needs.build.outputs.image_tag}}"

  notify:
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs: [security,build]
    steps: 
      - name: notify
        run: |
          echo "Sending notification email"
          echo "security result was: ${{ needs.security.outputs.result }}"
          echo "build failed due to security failures"
          exit 1

        



