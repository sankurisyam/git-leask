name: ShopKart Production Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  
  security:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.security.outputs.result }}
    steps:
      - name: security check
        id: security
        run: |
          echo "result=pass" >> $GITHUB_OUTPUT
  build:
    runs-on: ubuntu-latest
    needs: security
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: checkout
        uses: actions/checkout@v3


      - name: generate image tagp
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
      - name: build docker image 
        run: |
          docker build \
            -t gitleaks:${{steps.meta.outputs.image_tag}} .
      - name: docker save
        run: |
          docker save gitleaks:${{steps.meta.outputs.image_tag}} -o gitleaks.tar
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-image
          path: gitleaks.tar
  docker_scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-image
      - name: load image
        run: |
          docker load -i gitleaks.tar
      - name: scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gitleaks:${{ needs.build.outputs.image_tag }}
          
          
  