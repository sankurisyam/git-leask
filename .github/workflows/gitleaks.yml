name: ShopKart Production Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: config aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      - name: verify aws identity
        run: |
          aws sts get-caller-identity
      - name: login to amazon ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: generate image tag
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: build image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry}}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: docker build -t "$REGISTRY/git-leask:$IMAGE_TAG"
      - name: PUSH IMAGE
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry}}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          IMAGE="$REGISTRY/git-leask:$IMAGE_TAG"
          docker push "$IMAGE"
          digest=$(docker inspect --format='{{index .RepoDigests 0 }}' "$IMAGE" | cut -d'@' -f2)
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed image: $IMAGE"
          echo "Image digest: $digest"

  security_scan:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      - name: login to amazon ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: scan for secrets
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/git-leask@${{ needs.docker.outputs.image_digest }}
          severity: CRITICAL
          exit-code: 1
      - name: generate sbom
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/git-leask@${{ needs.docker.outputs.image_digest }}
          format: cyclonedx
          output: sbom.json
      - name: upload sbom
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sbom-${{ needs.docker.outputs.image_tag }}
          path: sbom.json

  sign-image:
    needs: [docker, security_scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: sign image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          IMAGE="ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.image_digest }}"
          cosign sign --yes "$IMAGE"

  verify-image:
    needs: [docker, security_scan, sign-image]
    runs-on: ubuntu-latest
    permissions:
      packages: read
      id-token: write
    steps:
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: verify image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.image_digest }}"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "$IMAGE"
  
      

  staging:
    needs: [docker, security_scan, sign-image, verify-image]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact verified image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.image_digest }}"
          echo "Security passed"
          echo "SBOM generated"
          echo "Image signature verified"
          echo "Deploying exact artifact:"
          echo "$IMAGE"
