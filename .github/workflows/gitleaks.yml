name: ShopKart Production Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
permissions: 
  contents: read
  packages: write

jobs:
  docker:
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      
      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: generate image tag
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA:0:7}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: build image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.image_tag }} .
      - name: PUSH IMAGE
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.image_tag }}
  security_scan:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: scan for secrets
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.image_tag }}
          severity: HIGH,CRITICAL
          exit-code: 1